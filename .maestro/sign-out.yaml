appId: ${APP_ID}
---
# Ordinary session sign-out only. Never clears app data or offline queues.
- runFlow:
    when:
      visible: More
    commands:
      - tapOn: More
      - scrollUntilVisible:
          element: Sign out
          direction: DOWN
          timeout: 60000
          centerElement: true
      - tapOn: Sign out
      - assertVisible: Sign out\?
      - tapOn:
          text: Sign out
          below: Sign out\?
      - assertVisible: Sign in to your business
