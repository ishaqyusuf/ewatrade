appId: ${APP_ID}
---
# Ordinary session sign-out only. Never clears app data or offline queues.
- runFlow:
    when:
      visible: More
    commands:
      - tapOn: More
      - scrollUntilVisible:
          element: Sign out
          direction: DOWN
          timeout: 60000
          # The final row cannot reach screen center at the scroll limit.
          centerElement: false
      # Android can expose the row while it is behind the fixed dock.
      # Continue toward the menu end before tapping the existing control.
      - scroll
      - tapOn: Sign out
      - assertVisible: Sign out\?
      # Background menu text remains accessible behind the sheet. Target the
      # actual confirmation button rather than text or inferred parent layers.
      - tapOn:
          id: more-sign-out-confirm
      - assertVisible: Sign in to your business
