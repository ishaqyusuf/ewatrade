appId: ${APP_ID}
---
# Ordinary session sign-out only. Never clears app data or offline queues.
- runFlow:
    when:
      visible: More
    commands:
      - tapOn: More
      - scrollUntilVisible:
          element: Sign out
          direction: DOWN
          timeout: 60000
          # The final row cannot reach screen center at the scroll limit.
          centerElement: false
      # Android can expose the row while it is behind the fixed dock.
      # Continue toward the menu end before tapping the existing control.
      - scroll
      - tapOn: Sign out
      - assertVisible: Sign out\?
      # The menu remains in the accessibility tree behind the sheet.
      # Match the confirmation action alongside Cancel, not its screen position.
      - tapOn:
          text: Sign out
          childOf:
            containsChild:
              text: Cancel
      - assertVisible: Sign in to your business
