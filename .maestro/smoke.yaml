appId: ${APP_ID}
name: QA catalog and sale draft
---
# Do not clear app data/offline queues or change permissions.
# The QA picker intentionally lives on signed-out login only. Use ordinary
# sign-out when reusing a client that already completed an earlier journey.
- launchApp
- extendedWaitUntil:
    visible: Sign in to your business|More
    timeout: 60000
- runFlow: sign-out.yaml
- assertVisible: Sign in to your business
- runFlow:
    when:
      visible: Set up QA
    commands:
      - tapOn: Set up QA
      - tapOn: QA domain, like name.qa.test
      - inputText: ${QA_DOMAIN}
      - tapOn: Load QA businesses
- tapOn: Open [0-9]+ QA businesses
- tapOn: QA domain options
- tapOn: Build details
- assertVisible: ${EXPECTED_RUNTIME}
- tapOn: Back to QA businesses
# An ADB reconnect can leave the chooser's previous request error cached. Use
# its normal recovery once; a continuing network failure still fails selection.
- runFlow:
    when:
      visible: Businesses unavailable
    commands:
      - tapOn: Try again
- scrollUntilVisible:
    element: ${PROFILE_LABEL}
    direction: DOWN
    # The existing QA directory now spans several screens on the emulator.
    timeout: 60000
    centerElement: true
- tapOn: ${PROFILE_LABEL}
- assertNotVisible: QA businesses
- tapOn: Goods
- scrollUntilVisible:
    element: ${CATALOG_ITEM}
    direction: DOWN
    timeout: 20000
    centerElement: true
- assertVisible: ${CATALOG_ITEM}
- tapOn: Home
- tapOn: New sale
- assertVisible: New sale
- scrollUntilVisible:
    element: ${OFFERING_LABEL}
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn: ${OFFERING_LABEL}
- scrollUntilVisible:
    element:
      id: sale-next-step
    direction: UP
    timeout: 20000
- tapOn:
    id: sale-next-step
- tapOn: Continue with walk-in
- assertVisible: Checkout
- assertVisible: ${EXPECTED_TOTAL}
- tapOn: Close create sale
- assertNotVisible: Checkout
# The current release is free. Paid activation must replace this acceptance
# with its reviewed signed purchase/restore coverage, not silently skip it.
- tapOn: More
- scrollUntilVisible:
    element: Plan & billing
    direction: DOWN
    timeout: 30000
    centerElement: true
- tapOn: Plan & billing
- assertVisible: Current plan
- assertNotVisible: Plan unavailable
- scrollUntilVisible:
    element: EwaTrade is free during launch.*
    direction: DOWN
    timeout: 20000
    centerElement: true
- assertNotVisible: Restore purchases
- assertNotVisible: Manage store subscriptions
- tapOn: Close plan and billing
- runFlow: sign-out.yaml
- tapOn: Open [0-9]+ QA businesses
- tapOn: QA domain options
- tapOn: Build details
- assertVisible: ${EXPECTED_RUNTIME}
- tapOn: Back to QA businesses
# The chooser can open as a compact sheet before its refreshed profile count
# switches later openings to the full-screen list. Both have a normal close.
- tapOn: Close QA businesses|close modal
- assertNotVisible: QA businesses
- assertVisible: Sign in to your business
