# Assistant coverage (H01) and feature impact (H02) gates. Both read tracked
# source only: no database, secrets, model or provider calls. Ignored Brain
# files are absent here, so the impact gate notes them instead of claiming them.
name: Assistant gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  assistant-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - name: Capability manifest and gate tests
        run: bun test packages/assistant/src/capabilities
      - name: Coverage snapshot is current
        run: bun --env-file=/dev/null --cwd apps/api scripts/assistant-coverage.ts --check
      - name: Impact record covers gated changes
        run: bun scripts/assistant-impact.ts --base ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
