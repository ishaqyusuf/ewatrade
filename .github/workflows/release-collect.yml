name: Release fact collection

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected provider environment to inspect
        type: choice
        required: true
        default: preview
        options:
          - preview
          - production
      revision:
        description: Full candidate commit SHA on the main branch
        type: string
        required: true
      preview_deployment_ids:
        description: JSON object mapping each Vercel target to its Preview deployment ID
        type: string
        required: false

concurrency:
  group: release-collect-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    name: collect-${{ inputs.environment }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    steps:
      - name: Resolve trusted default-branch revision
        id: trusted
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$DEFAULT_BRANCH" == main ]]
          sha="$(gh api "repos/$REPOSITORY/commits/$DEFAULT_BRANCH" --jq .sha)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Check out trusted collector at immutable default-branch revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.trusted.outputs.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Validate candidate revision against trusted main history
        id: candidate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.revision }}
          TRUSTED_SHA: ${{ steps.trusted.outputs.sha }}
          TRUSTED_DIRECTORY: ${{ github.workspace }}/trusted
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git -C "$TRUSTED_DIRECTORY" cat-file -e "$CANDIDATE_SHA^{commit}"
          git -C "$TRUSTED_DIRECTORY" merge-base --is-ancestor "$CANDIDATE_SHA" "$TRUSTED_SHA"
          printf 'sha=%s\n' "$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out candidate as manifest-only data with full Git history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.candidate.outputs.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          sparse-checkout: /release.manifest.json
          sparse-checkout-cone-mode: false

      - name: Install only the trusted collector toolchain
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.9"

      - name: Install trusted checkout dependencies without lifecycle scripts
        working-directory: trusted
        shell: bash
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Require current main before Production reads
        if: inputs.environment == 'production'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)"
          [[ "$current_main" =~ ^[0-9a-f]{40}$ ]]
          [[ "$current_main" == "$CANDIDATE_SHA" ]]

      - name: Collect unsigned application provider facts
        id: facts
        continue-on-error: true
        working-directory: trusted
        shell: bash
        env:
          RELEASE_ENVIRONMENT: ${{ inputs.environment }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          CANDIDATE_DIRECTORY: ${{ github.workspace }}/candidate
          REPORT_DIRECTORY: ${{ runner.temp }}/ewatrade-release-facts
          EWATRADE_RELEASE_PREVIEW_DEPLOYMENT_IDS_JSON: ${{ inputs.preview_deployment_ids }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
          TRIGGER_RELEASE_READ_KEY: ${{ secrets.TRIGGER_RELEASE_READ_KEY }}
          TRIGGER_EXPECTED_ORGANIZATION_ID: ${{ vars.TRIGGER_EXPECTED_ORGANIZATION_ID }}
          EWATRADE_RELEASE_NATIVE_ENVIRONMENT_JSON: ${{ secrets.EWATRADE_RELEASE_NATIVE_ENVIRONMENT_JSON }}
          EWATRADE_RELEASE_NATIVE_ENVIRONMENT_SHA256: ${{ vars.EWATRADE_RELEASE_NATIVE_ENVIRONMENT_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$REPORT_DIRECTORY"
          set +e
          bun --env-file=/dev/null scripts/release-collect.ts \
            --env "$RELEASE_ENVIRONMENT" \
            --repo "$CANDIDATE_DIRECTORY" \
            --revision "$CANDIDATE_SHA" \
            > "$REPORT_DIRECTORY/release-facts.json"
          collector_status=$?
          set -e
          [[ "$collector_status" -eq 1 ]]
          jq -e --arg env "$RELEASE_ENVIRONMENT" --arg rev "$CANDIDATE_SHA" \
            '.version == 1 and .environment == $env and .revision == $rev and .releaseReady == false and (.sourceHashes | type == "object") and (.fragments | type == "object" and has("vercel") and has("trigger") and has("mobile"))' \
            "$REPORT_DIRECTORY/release-facts.json" > /dev/null
          printf 'partial=true\n' >> "$GITHUB_OUTPUT"
          exit 1

      - name: Upload source-safe unsigned fact report
        if: always() && steps.facts.outputs.partial == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ewatrade-release-facts-${{ inputs.environment }}-${{ steps.candidate.outputs.sha }}
          path: ${{ runner.temp }}/ewatrade-release-facts/release-facts.json
          if-no-files-found: error
          retention-days: 7

      - name: Keep unsigned collection visibly partial
        if: always()
        shell: bash
        env:
          COLLECTION_OUTCOME: ${{ steps.facts.outputs.partial }}
        run: |
          set -euo pipefail
          if [[ "$COLLECTION_OUTCOME" == true ]]; then
            echo "Unsigned provider facts were collected; this is not a release assurance result."
            exit 1
          fi
          echo "Fact collection did not produce a validated report."
          exit 2
