name: Release assurance

on:
  pull_request_target:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Release environment to verify
        type: choice
        required: true
        default: preview
        options:
          - preview
          - production

concurrency:
  group: release-assurance-${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')) && 'production' || 'preview' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: release-assurance-${{ github.event_name == 'pull_request_target' && 'preview' || github.event_name == 'push' && 'production' || inputs.environment }}
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'pull_request_target' && 'preview' || github.event_name == 'push' && 'production' || inputs.environment }}
    steps:
      - name: Refuse external fork Preview verification
        if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository
        run: exit 1

      - name: Resolve trusted verifier revision from default branch
        id: trusted
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/$REPOSITORY/commits/$DEFAULT_BRANCH" --jq .sha)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Check out trusted verifier by immutable revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.trusted.outputs.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Resolve exact candidate revision
        id: candidate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out candidate release repository with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.candidate.outputs.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          sparse-checkout: /release.manifest.json
          sparse-checkout-cone-mode: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.9"

      - name: Verify release evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          RELEASE_ENVIRONMENT: ${{ github.event_name == 'pull_request_target' && 'preview' || github.event_name == 'push' && 'production' || inputs.environment }}
          EWATRADE_RELEASE_EVIDENCE_ENVELOPE: ${{ secrets.EWATRADE_RELEASE_EVIDENCE_ENVELOPE }}
          EWATRADE_RELEASE_EVIDENCE_HMAC_KEY: ${{ secrets.EWATRADE_RELEASE_EVIDENCE_HMAC_KEY }}
          EWATRADE_RELEASE_NATIVE_ENVIRONMENT_JSON: ${{ secrets.EWATRADE_RELEASE_NATIVE_ENVIRONMENT_JSON }}
          EWATRADE_RELEASE_NATIVE_ENVIRONMENT_SHA256: ${{ vars.EWATRADE_RELEASE_NATIVE_ENVIRONMENT_SHA256 }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_ENVIRONMENT" == production ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]]
            current_main="$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)"
            [[ "$current_main" == "$CANDIDATE_SHA" ]]
          fi
          cd "$GITHUB_WORKSPACE/trusted"
          exec bun --env-file=/dev/null scripts/release-verify.ts \
            --env "$RELEASE_ENVIRONMENT" \
            --repo "$GITHUB_WORKSPACE/candidate" \
            --revision "$CANDIDATE_SHA"

  preview-candidate-check:
    name: Publish Preview candidate result
    needs: verify
    if: >-
      always() && github.event_name == 'pull_request_target' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      # pull_request_target's automatic job check belongs to the default-branch
      # SHA. This trusted job publishes the verifier result on the PR head SHA.
      # It has no checkout, candidate execution, environment or provider secrets.
      - name: Publish exact candidate check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          VERIFICATION_RESULT: ${{ needs.verify.result }}
        run: |
          set -euo pipefail
          [[ "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || exit 1
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]] || exit 1
          conclusion=failure
          if [[ "$VERIFICATION_RESULT" == success ]]; then conclusion=success; fi
          details="https://github.com/$REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
          response="$(jq -n --arg sha "$CANDIDATE_SHA" --arg conclusion "$conclusion" \
            --arg details "$details" \
            '{name:"release-assurance-preview-candidate",head_sha:$sha,status:"completed",conclusion:$conclusion,details_url:$details,output:{title:"Preview release verification",summary:"Result from the trusted five-target application verifier; see the workflow run for evidence."}}' \
            | gh api --method POST "repos/$REPOSITORY/check-runs" --input - \
              --jq '[.name,.head_sha,.status,.conclusion] | @tsv')"
          expected="$(printf 'release-assurance-preview-candidate\t%s\tcompleted\t%s' "$CANDIDATE_SHA" "$conclusion")"
          [[ "$response" == "$expected" ]] || exit 1
